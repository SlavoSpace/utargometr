:root.ciemny{--tlo:#0B0F0D;--pow:#121915;--pow2:#101613;--pow3:#18211C;--wybrany:#16201B;--linia:#1E2823;--ramka:#24302A;--ramka2:#33423A;--tekst:#EEF4F0;--tekst2:#9DAEA4;--tekst3:#85948B;--akcja:#5DFF8A;--naAkcji:#052012;--wolne:#5DFF8A;--pelne:#FFC85C;--zaduzo:#FF7A7A;--moc:#7CC0FF;--aktywny:#EEF4F0;--naAktywnym:#0B0F0D;--nieaktywny:#C9D6CF;--cien:rgba(0,0,0,.5);--wylaczony:#1F2924;--naWylaczonym:#85948B;--okTlo:#14241B;--okRamka:#2F6B47;--okTekst:#8CF5B0;--uwTlo:#2A2213;--uwRamka:#6E5422;--uwTekst:#FFD27A;--blTlo:#2A1616;--blRamka:#5C2B2B;--blTekst:#FF9B9B;--mocTlo:#15283D;--mocRamka:#2B4C70;--mocTekst:#9CCFFF;--zaslona:rgba(0,0,0,.62);--R:#E3A882;--F:#9CC7A6;--T:#8DB6E0;--zM:#E7C26E;--zB:#B9B3DE;--mTab:#B4A5FF;--mMag:#F0B25A;--mRap:#7CB7FF;--mMan:#5DFF8A;--mTra:#8DB6E0;--mObe:#D7A6EA;--mHar:#7FD6D6;color-scheme:dark}
:root.jasny{color-scheme:light}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--tlo);color:var(--tekst);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;text-align:inherit}
button:disabled,button[aria-disabled="true"]{cursor:default}
button:active:not(:disabled):not([aria-disabled="true"]){filter:brightness(.93)}
:focus{outline:none}
:focus-visible{outline:3px solid var(--moc);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--tekst)}
svg{display:block;flex:0 0 auto}
p{margin:0}
h1,h2,h3{margin:0;text-wrap:balance}
.bebas{font-family:"Bebas Neue","Avenir Next Condensed","Roboto Condensed","Arial Narrow",Inter,sans-serif;font-weight:400;letter-spacing:.05em;line-height:1}
.etykieta{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--tekst3)}
.cyfry{font-variant-numeric:tabular-nums}
.mono{font-family:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.ukryte{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{height:100%;display:flex;flex-direction:column;min-height:0;padding-top:env(safe-area-inset-top,0px)}
@keyframes wjazd{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes potrzasnij{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.potrzasnij{animation:potrzasnij .4s ease}

/* ── nagłówek ── */
.nag{flex:0 0 auto;min-height:60px;display:flex;align-items:center;gap:14px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(20px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--linia);background:var(--tlo);position:relative;z-index:5}
.nag-l{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.nag-tyt{font-size:30px;padding-top:3px;white-space:nowrap}
.pokaz-chip{font-size:11px;font-weight:800;letter-spacing:.08em;padding:3px 7px;border-radius:6px;border:1px solid var(--uwRamka);background:var(--uwTlo);color:var(--uwTekst)}
.nawig{flex:1 1 auto;min-width:0;display:flex;justify-content:center}
.nawig-w{display:inline-flex;gap:2px;padding:3px;border-radius:12px;background:var(--pow);border:1px solid var(--ramka);max-width:100%;overflow-x:auto;scrollbar-width:none}
.nawig-w::-webkit-scrollbar{display:none}
.nawig-w button{position:relative;height:38px;padding:0 12px;border-radius:9px;font-size:14px;font-weight:700;color:var(--nieaktywny);display:flex;align-items:center;gap:6px;white-space:nowrap}
.nawig-w button[aria-current="page"]{background:var(--aktywny);color:var(--naAktywnym)}
.licz{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--uwTlo);color:var(--uwTekst);border:1px solid var(--uwRamka);font-size:11.5px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.nawig-w button[aria-current="page"] .licz{background:var(--naAktywnym);color:var(--aktywny);border-color:transparent}
.nag-p{display:flex;align-items:center;gap:12px;flex:0 0 auto}
.nag-czas{font-size:22px;padding-top:2px;white-space:nowrap;font-variant-numeric:tabular-nums}
.menu-btn{height:42px;max-width:170px;padding:0 10px 0 6px;border-radius:11px;border:1px solid var(--ramka);background:var(--pow);display:flex;align-items:center;gap:8px;min-width:0}
.menu-imie{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:1320px){.nag-czas{display:none}}
@media (max-width:900px){.nag{flex-wrap:wrap;padding-top:6px;padding-bottom:6px;gap:8px 10px}.nawig{order:3;flex:1 0 100%;justify-content:flex-start}.nag-l{flex:1 1 auto}.nag-tyt{font-size:26px}}
@media (max-width:520px){.menu-imie{display:none}.menu-btn{padding:0 5px}}

/* ── awatar, chipy, przyciski ── */
.awatar{--kol:var(--tekst3);width:34px;height:34px;flex:0 0 34px;border-radius:50%;background:var(--pow3);border:2px solid var(--kol);color:var(--kol);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800}
.awatar.duzy{width:56px;height:56px;flex-basis:56px;font-size:22px}
.awatar.maly{width:28px;height:28px;flex-basis:28px;font-size:12px;border-width:1.5px}
.awatar.urz{border-radius:9px}
.glowny{min-height:52px;padding:0 20px;border-radius:15px;background:var(--akcja);color:var(--naAkcji);font-size:16px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.glowny.maly{min-height:44px;padding:0 16px;border-radius:12px;font-size:15px}
.glowny:disabled,.glowny[aria-disabled="true"]{background:var(--wylaczony);color:var(--naWylaczonym)}
.glowny.czerwony{background:var(--zaduzo);color:#fff}
.glowny.ciemny{background:var(--aktywny);color:var(--naAktywnym)}
.drugi{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--ramka2);background:transparent;color:var(--tekst);font-size:14.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-align:center}
.drugi.maly{min-height:36px;padding:0 11px;border-radius:10px;font-size:13.5px}
.drugi.czerwony{color:var(--blTekst);border-color:var(--blRamka)}
.drugi.zielony{color:var(--okTekst);border-color:var(--okRamka)}
.drugi.uwaga{color:var(--uwTekst);border-color:var(--uwRamka);background:var(--uwTlo)}
.drugi[aria-pressed="true"]{background:var(--aktywny);color:var(--naAktywnym);border-color:var(--aktywny)}
.link{display:inline-flex;align-items:center;gap:6px;color:var(--mocTekst);font-weight:700;font-size:14px;min-height:36px}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;border-radius:11px;background:var(--pow);border:1px solid var(--ramka)}
.seg button{min-height:34px;min-width:40px;padding:0 11px;border-radius:8px;font-size:13.5px;font-weight:700;color:var(--nieaktywny);display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--aktywny);color:var(--naAktywnym)}
.seg button:disabled{opacity:.4}
.pill{display:inline-flex;align-items:center;gap:5px;min-height:22px;padding:1px 8px;border-radius:7px;border:1px solid var(--ramka2);font-size:12px;font-weight:700;color:var(--tekst2);white-space:nowrap;line-height:1.2}
.pill.ok{background:var(--okTlo);border-color:var(--okRamka);color:var(--okTekst)}
.pill.uw{background:var(--uwTlo);border-color:var(--uwRamka);color:var(--uwTekst)}
.pill.bl{background:var(--blTlo);border-color:var(--blRamka);color:var(--blTekst)}
.pill.moc{background:var(--mocTlo);border-color:var(--mocRamka);color:var(--mocTekst)}
.pill.cicha{border-style:dashed;color:var(--tekst3)}
.mb{--kol:var(--tekst3);display:inline-flex;align-items:center;gap:6px;min-height:24px;padding:2px 8px 2px 6px;border-radius:7px;border:1px solid var(--ramka);background:var(--pow2);font-size:12px;font-weight:700;color:var(--tekst2);white-space:nowrap}
.mb::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--kol);flex:0 0 auto}
.mb b{color:var(--tekst);font-weight:800}
.ikona{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ikona.mala{width:15px;height:15px}

/* ── układ treści ── */
.tresc{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.wnetrze{width:min(1180px,100%);margin:0 auto;padding:20px max(20px,env(safe-area-inset-right,0px)) 40px max(20px,env(safe-area-inset-left,0px))}
.karta{border:1px solid var(--ramka);background:var(--pow);border-radius:16px;padding:16px}
.karta-tyt{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.karta-tyt h2{font-size:17px;font-weight:800}
.h1{font-size:26px;font-weight:800;line-height:1.2}
.pod{font-size:14px;color:var(--tekst2);max-width:70ch}
.pod b{color:var(--tekst)}
.siatka{display:grid;gap:14px}
.puste{padding:28px 16px;text-align:center;color:var(--tekst2);display:flex;flex-direction:column;align-items:center;gap:10px}

/* ── ZDZISŁAW ── */
.zdz{position:relative;display:block;flex:0 0 auto;-webkit-tap-highlight-color:transparent}
.zdz img{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;pointer-events:none}
.zdz.unosi img{animation:unos 3.4s ease-in-out infinite}
@keyframes unos{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.zdz.unosi::after{content:"";position:absolute;left:22%;right:22%;bottom:-2%;height:9%;border-radius:50%;background:radial-gradient(closest-side,rgba(111,211,255,.42),rgba(111,211,255,0));animation:pole 3.4s ease-in-out infinite;pointer-events:none}
@keyframes pole{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
.zdz.wej img{animation:zdzWej .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes zdzWej{from{transform:translateY(10px) scale(.96);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.zdz.unosi img,.zdz.unosi::after,.zdz.wej img{animation:none}}
.dymek{position:relative;background:#1d1d1d;color:#e8f3ec;border:2px solid #9fe3b4;border-radius:16px;padding:12px 15px 13px;box-shadow:0 6px 22px rgba(0,0,0,.18);font-size:14.5px;line-height:1.45}
.dymek .d-tyt{font-family:"Bebas Neue","Avenir Next Condensed","Roboto Condensed","Arial Narrow",Inter,sans-serif;letter-spacing:.07em;color:#9fe3b4;font-size:17px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.dymek .d-tyt .kursor{width:8px;height:15px;background:#e2a54e;display:inline-block;animation:mrugK 1s steps(1) infinite}
@keyframes mrugK{50%{opacity:0}}
.dymek .d-pod{margin-top:7px;font-size:12px;color:#a9c9b6}
.dymek b{color:#fff}
.dymek .d-akcje{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.dymek .d-akcje button{min-height:34px;padding:0 12px;border-radius:9px;border:1px solid #9fe3b4;color:#9fe3b4;font-size:13px;font-weight:800}
.dymek::after{content:"";position:absolute;width:16px;height:16px;background:#1d1d1d;border:2px solid #9fe3b4;border-top:0;border-left:0}
.dymek.ogon-dol::after{left:var(--ogon,50%);bottom:-10px;transform:translateX(-50%) rotate(45deg)}
.dymek.ogon-lewo::after{left:-10px;top:var(--ogon,40px);transform:rotate(135deg)}
.dymek.ogon-prawo::after{right:-10px;top:var(--ogon,40px);transform:rotate(-45deg)}
.dymek.wej{animation:wjazd .25s ease}

/* ── start i PIN ── */
.start{flex:1;min-height:0;overflow-y:auto}
.start-w{width:min(1040px,100%);margin:0 auto;padding:34px max(20px,env(safe-area-inset-right,0px)) 36px max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:22px}
.start-gora{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.start-logo{font-size:58px}
.start-pod{font-size:14px;color:var(--tekst2);display:block;margin-top:6px}
.start-pod.pokaz{color:var(--uwTekst)}
.start-uklad{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:center}
.kafelki{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
@media (min-width:640px){.kafelki{grid-template-columns:repeat(3,minmax(0,1fr))}}
.kafel{min-height:104px;padding:12px 14px;border-radius:16px;border:1px solid var(--ramka);background:var(--pow);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:6px;text-align:left}
.kafel-imie{font-size:18px;font-weight:800}
.kafel-rola{font-size:12.5px;color:var(--tekst2)}
.kafel-inna{border-style:dashed;border-color:var(--ramka2);background:transparent;color:var(--tekst2);font-size:16px;font-weight:700;align-items:center}
.start-zdz{display:flex;flex-direction:column;align-items:center;gap:14px}
.start-zdz .zdz{width:220px}
.pole{display:flex;flex-direction:column;gap:6px}
.pole input,.pole select,.pole textarea{min-height:50px;padding:0 14px;border-radius:13px;border:1px solid var(--ramka2);background:var(--pow2);font-size:17px}
.pole select{padding-right:34px;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--tekst2) 50%),linear-gradient(135deg,var(--tekst2) 50%,transparent 50%);background-position:calc(100% - 18px) 22px,calc(100% - 12px) 22px;background-size:6px 6px;background-repeat:no-repeat}
.pole input:focus,.pole select:focus{border-color:var(--moc);outline:none}
.pole .blad{font-size:13px;color:var(--zaduzo);font-weight:600}
.pole .pomoc{font-size:12.5px;color:var(--tekst3)}
.pin-uklad{display:grid;grid-template-columns:minmax(0,400px) 240px;gap:40px;justify-content:center;align-items:center}
.pin{width:100%;display:flex;flex-direction:column;align-items:center;gap:16px}
.pin-imie{font-size:28px;font-weight:800}
.pin-pod{font-size:15px;color:var(--tekst2)}
.kropki{display:flex;gap:11px;height:22px;align-items:center}
.kropki span{width:16px;height:16px;border-radius:8px;border:2px solid var(--ramka2)}
.kropki span.p{background:var(--tekst);border-color:var(--tekst)}
.klaw-pin{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kl{height:62px;border-radius:16px;border:1px solid var(--ramka);background:var(--pow);font-size:27px;font-weight:600;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center}
.kl.maly{font-size:15px;font-weight:700;color:var(--tekst2)}
.pin-hint{font-size:13px;color:var(--tekst2);text-align:center}
.pin-zdz{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.pin-zdz .zdz{width:180px}
.pin-zdz p{font-size:13px;color:var(--tekst2);max-width:24ch}
@media (max-width:760px){.start-zdz .dymek.ogon-dol::after{left:-10px;bottom:auto;top:40px;transform:rotate(135deg)}.start-uklad{grid-template-columns:1fr}.start-zdz{flex-direction:row-reverse;align-items:flex-end}.start-zdz .zdz{width:120px}.start-zdz .dymek{flex:1}.pin-uklad{grid-template-columns:1fr;gap:12px}.pin-zdz{order:-1;flex-direction:row;gap:12px;text-align:left}.pin-zdz .zdz{width:70px}.start-logo{font-size:46px}}

/* ── pulpit ── */
.pulpit{display:grid;grid-template-columns:330px minmax(0,1fr);gap:22px;align-items:start}
.zdz-panel{position:sticky;top:0;display:flex;flex-direction:column;align-items:center;gap:16px;padding-top:4px}
.zdz-panel .dymek{width:100%}
.zdz-panel .zdz{width:240px;margin-top:4px}
.zdz-panel .zdz-pod{font-size:12px;color:var(--tekst3)}
.zrob{display:flex;flex-direction:column}
.zrob-w{display:flex;align-items:center;gap:14px;padding:12px 2px;border-top:1px solid var(--linia)}
.zrob-w:first-child{border-top:0;padding-top:2px}
.zrob-ik{width:42px;height:42px;flex:0 0 42px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--pow3);color:var(--tekst2)}
.zrob-ik.uw{background:var(--uwTlo);color:var(--uwTekst)}
.zrob-ik.moc{background:var(--mocTlo);color:var(--mocTekst)}
.zrob-ik.bl{background:var(--blTlo);color:var(--blTekst)}
.zrob-tr{flex:1;min-width:0}
.zrob-tr b{display:block;font-size:15.5px}
.zrob-tr span{font-size:13px;color:var(--tekst2)}
.liczby{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.liczba{padding:12px;border-radius:13px;background:var(--pow2);border:1px solid var(--linia);text-align:left}
.liczba b{display:block;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.liczba span{font-size:12.5px;color:var(--tekst2)}
button.liczba:active{filter:brightness(.95)}
.zespoly{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.belki{display:flex;flex-direction:column;gap:9px}
.belka{display:grid;grid-template-columns:132px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:13.5px}
.belka .tor{height:10px;border-radius:5px;background:var(--pow3);overflow:hidden}
.belka .tor i{display:block;height:100%;border-radius:5px;background:var(--kol)}
.belka b{text-align:right;font-variant-numeric:tabular-nums}
.belka.wkrotce{color:var(--tekst3)}
.belka.wkrotce .tor{background:repeating-linear-gradient(90deg,var(--pow3) 0 6px,transparent 6px 10px)}
.zmiany{display:flex;flex-direction:column}
.zmiana{display:grid;grid-template-columns:86px minmax(0,1fr);gap:10px;padding:9px 0;border-top:1px solid var(--linia);font-size:13.5px}
.zmiana:first-child{border-top:0;padding-top:0}
.zmiana time{color:var(--tekst3);font-variant-numeric:tabular-nums;font-size:12.5px;padding-top:1px}
.zmiana small{display:block;color:var(--tekst3);font-size:12px;margin-top:1px}

}

/* utargometr.dysza.app — Utargometr (na wspólnym wyglądzie managera: styl-managera.css). Minimalizm i symetria:
   wybór dnia na środku, suma dnia „∑ (gg:mm) =”, dwa równe kafle F | R z tymi samymi wierszami (i, t, s, ∑),
   cztery równe kafle płatności, rytm dnia, transakcje. Wszystkie pola i przyciski 44 px. */
:root{--mUt:#4A7A12;--info:#2F74C0;--naInfo:#FFFFFF;--arch:#B8892A;--archTlo:rgba(184,137,42,.10);--archRamka:rgba(184,137,42,.5);--wys:44px}
:root.ciemny{--mUt:#B9EE6A;--arch:#e8c06a;--archTlo:rgba(232,192,106,.12);--archRamka:rgba(232,192,106,.55)}

/* Architekt — złoto ponad kolorami modułów (jak w managerze) */
.arch{display:inline-flex;align-items:center;gap:5px;padding:2px 9px 2px 7px;border-radius:999px;border:1px solid var(--archRamka);background:var(--archTlo);color:var(--arch);font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;vertical-align:middle}
.arch .ikona{width:14px;height:14px;stroke-width:2.2}
.arch-t{color:var(--arch);font-weight:800}
.awatar.arch-aw{box-shadow:0 0 0 2px var(--tlo),0 0 0 4px var(--arch)}
.m-wersja{display:block;padding:8px 10px 4px;font-size:12px;color:var(--tekst3);font-variant-numeric:tabular-nums}

/* nagłówek: UTARGOMETR w kolorze modułu, ikona „i” tuż przed kafelkiem z imieniem */
.nag-tyt{color:var(--mUt)}
.nag-sr{flex:1 1 auto}
.info-i{width:42px;height:42px;flex:0 0 42px;border-radius:50%;background:var(--info);color:var(--naInfo);display:inline-flex;align-items:center;justify-content:center;font:italic 700 26px/1 Georgia,"Times New Roman",serif;padding-bottom:1px}
@media (max-width:640px){.info-i{width:44px;height:44px;flex-basis:44px}}

/* wybór dnia: ‹ data › — trzy pola tej samej wysokości, na środku */
.ut-dzien{display:grid;grid-template-columns:96px var(--wys) minmax(0,380px) var(--wys) 96px;gap:10px;justify-content:center;align-items:center}
.ut-tryb{height:var(--wys);border-radius:12px;border:1px solid var(--ramka2);background:var(--pow);color:var(--nieaktywny);font-size:14px;font-weight:800;padding:0 10px;white-space:nowrap;display:flex;align-items:center;justify-content:center}
.ut-tryb[aria-pressed="true"]{background:var(--aktywny);border-color:var(--aktywny);color:var(--naAktywnym)}
.ut-strz{width:var(--wys);height:var(--wys);border-radius:12px;border:1px solid var(--ramka2);background:var(--pow);display:flex;align-items:center;justify-content:center;color:var(--tekst)}
.ut-strz .ikona{width:20px;height:20px;stroke-width:2.4}
.ut-strz:disabled{opacity:.32}
.ut-data{height:var(--wys);border-radius:12px;border:1px solid var(--ramka2);background:var(--pow);display:flex;align-items:center;justify-content:center;gap:9px;padding:0 14px;font-size:16px;font-weight:800;min-width:0}
.ut-data span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ut-data .ikona{color:var(--tekst3);flex:0 0 18px}
.ut-data .ut-kr{display:none}

/* suma dnia — format „∑ (gg:mm) = kwota” z ustalenia nr 79 */
.ut-suma{text-align:center;margin:26px 0 4px}
.ut-suma-l{display:flex;align-items:baseline;justify-content:center;gap:14px;flex-wrap:wrap}
.ut-znak{font-size:36px;color:var(--mUt);letter-spacing:.05em;white-space:nowrap}
.ut-kw{font-size:80px;line-height:.86;letter-spacing:.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.ut-kw small{font-size:.42em;color:var(--tekst2);margin-left:8px;letter-spacing:.06em}
.ut-stan{margin-top:12px;font-size:14px;color:var(--tekst2);display:flex;justify-content:center;align-items:center;gap:6px 10px;flex-wrap:wrap}
.ut-stan .kr{width:4px;height:4px;border-radius:50%;background:var(--ramka2)}
.ut-zywo{display:inline-flex;align-items:center;gap:7px;font-weight:800;color:var(--okTekst);letter-spacing:.04em;text-transform:uppercase;font-size:12px}
.ut-zywo::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--wolne);animation:ut-puls 2s ease-in-out infinite}
.ut-arch{display:inline-flex;align-items:center;gap:7px;font-weight:800;color:var(--tekst3);letter-spacing:.04em;text-transform:uppercase;font-size:12px}
.ut-wroc{min-height:32px;padding:0 10px;border-radius:9px;border:1px solid var(--ramka2);font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
@keyframes ut-puls{0%,100%{opacity:1}50%{opacity:.25}}
.ut-alarm{max-width:760px;margin:14px auto 0}

/* F | R — dwa równe kafle, te same wiersze (i, t, s, ∑) i te same kolumny: udział · szt. · kwota (ustalenie nr 104) */
.ut-mr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:24px}
.ut-k{--kol:var(--tekst3);border:1px solid var(--ramka);background:var(--pow);border-radius:16px;padding:14px 16px 8px;min-width:0}
.ut-k-g{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:28px}
.ut-k-g h3{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--tekst2);display:flex;align-items:center;gap:9px}
.ut-k-g h3::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--kol)}
.ut-k-g .ut-ud{font-size:13px;font-weight:800;color:var(--tekst2);font-variant-numeric:tabular-nums}
.ut-w{display:grid;grid-template-columns:28px minmax(0,1fr) 66px 46px minmax(104px,auto);gap:10px;align-items:center;min-height:40px;font-size:15px;font-variant-numeric:tabular-nums}
.ut-w + .ut-w{border-top:1px solid var(--linia)}
.ut-w > span:nth-child(n+3){text-align:right;white-space:nowrap}
.ut-w .lit{width:26px;height:24px;border-radius:7px;border:1.5px solid var(--kol);color:var(--kol);display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;line-height:1}
.ut-w .op{color:var(--tekst2);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ut-w .z{font-weight:700}
.ut-w.ety{min-height:26px;font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--tekst3)}
.ut-w.pusty{color:var(--tekst3)}
.ut-w.pusty .lit{opacity:.45;border-style:dashed}
.ut-w.pusty .z{font-weight:400}
.ut-w.suma{border-top:1px solid var(--ramka2)!important;font-weight:800;min-height:44px}
.ut-w.suma .lit{border:0;font-size:19px;width:26px;color:var(--tekst)}
.ut-w.suma .z{font-size:18px;font-weight:800}

/* płatności — cztery równe kafle; voucher osobno, poza utargiem */
.ut-plat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:14px}
.ut-p{border:1px solid var(--ramka);background:var(--pow);border-radius:16px;padding:12px 16px 13px;display:grid;gap:3px;min-width:0}
.ut-p b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ut-p > span:last-child{font-size:13px;color:var(--tekst2);font-variant-numeric:tabular-nums;white-space:nowrap}
.ut-voucher{margin-top:10px;text-align:center;font-size:13px;color:var(--tekst3)}

/* rytm dnia — utarg godzina po godzinie (F na dole, R na górze); stuknięcie godziny zawęża listę */
.ut-rytm{border:1px solid var(--ramka);background:var(--pow);border-radius:16px;padding:14px 16px 10px;margin-top:14px}
.ut-rytm-g{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.ut-leg{display:flex;gap:16px;font-size:12.5px;color:var(--tekst2)}
.ut-leg span{display:inline-flex;align-items:center;gap:7px}
.ut-leg i{width:10px;height:10px;border-radius:3px;background:var(--kol)}
.ut-slupki{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:8px;align-items:end;height:128px}
.ut-s{position:relative;display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:2px;padding:0 3px;border-radius:9px;min-width:0}
.ut-s i{display:block;border-radius:4px;min-height:0}
.ut-s .r{background:var(--R)}
.ut-s .f{background:var(--F)}
.ut-s.przysz{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--linia) 6px 7px)}
.ut-s.teraz i:first-child{animation:ut-puls 2s ease-in-out infinite}
.ut-s.wyb{background:var(--pow3);box-shadow:inset 0 0 0 2px var(--moc)}
.ut-s:disabled{cursor:default}
.ut-godz{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:8px;margin-top:7px;text-align:center;font-size:12px;color:var(--tekst3);font-variant-numeric:tabular-nums}
.ut-godz .wyb{color:var(--mocTekst);font-weight:800}
/* miesiąc: słupki dzień po dniu, lista dni, wybór miesiąca */
.ut-slupki.m,.ut-godz.m{gap:4px}
.ut-slupki.m .ut-s{padding:0 1px;border-radius:6px}
.ut-godz.m{font-size:11px}
.ut-ster-m{display:flex;justify-content:flex-end;margin-bottom:12px}
.ut-ster-m .kop{min-height:var(--wys)}
.dni-w{border:1px solid var(--ramka);background:var(--pow);border-radius:16px;overflow:hidden}
table.dni{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
.dni th{background:var(--pow2);text-align:right;padding:10px;border-bottom:1px solid var(--ramka);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--tekst3);white-space:nowrap}
.dni td{padding:9px 10px;border-bottom:1px solid var(--linia);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.dni th:first-child,.dni td:first-child{text-align:left}
.dni tbody tr{cursor:pointer}
.dni tbody tr:hover td,.dni tbody tr:focus-visible td{background:var(--pow3)}
.dni td.d{font-weight:700}
.dni td.d small{display:block;font-weight:500;font-size:11.5px;color:var(--tekst3)}
.dni tr.dzis td.d small{color:var(--mocTekst);font-weight:700}
.dni tr.pusty td{color:var(--tekst3)}
.dni td.s b{font-size:14.5px}
.dni tfoot td{background:var(--pow2);font-weight:800;border-bottom:0}
.ut-mies{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ut-mz{min-height:64px}

/* transakcje */
.ut-tr{margin-top:28px}
.ut-tr-g{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.ut-tr-g h2{font-size:20px;font-weight:800}
.ut-tr-g .pod{font-size:13.5px}
.ut-ster{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;grid-template-areas:"m k h p" "q q q kop";gap:10px 12px;align-items:center;margin-bottom:12px}
.ut-ster > .seg{min-height:var(--wys);align-items:center}
.ut-ster > .seg button{min-height:36px}
.ut-ster > .m{grid-area:m}
.ut-ster > .k{grid-area:k}
.ut-ster > .pok{grid-area:p;justify-self:end}
.ut-ster > .szukaj{grid-area:q;height:var(--wys)}
.ut-ster > .kop{grid-area:kop}
.ut-ster select{height:var(--wys);min-width:210px;border-radius:12px;border:1px solid var(--ramka2);background-color:var(--pow);padding:0 36px 0 14px;font-size:14.5px;font-weight:700;appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--tekst2) 50%),linear-gradient(135deg,var(--tekst2) 50%,transparent 50%);background-position:calc(100% - 20px) 19px,calc(100% - 14px) 19px;background-size:6px 6px;background-repeat:no-repeat}
.ut-ster .kop{min-height:var(--wys)}
/* Hitometr: przycisk za kanałami (jak na zrzucie z 18.11), okno w dniu, stałe okno pod „Dni” w miesiącu */
.ut-ster > .hit{grid-area:h;justify-self:start;min-height:var(--wys)}
.ut-hit-ster{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;margin-bottom:12px}
.ut-hit-ster .seg button{min-height:36px}
.ut-hit-ster .kop{min-height:var(--wys)}
.ut-hit{border:1px solid var(--ramka);background:var(--pow);border-radius:16px;overflow:hidden}
.ut-hit.m{max-height:min(72vh,820px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.ut-hit-w{display:grid;grid-template-columns:30px minmax(0,1fr) 56px 64px 104px;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--linia);font-size:14px;font-variant-numeric:tabular-nums}
.ut-hit-w:last-child{border-bottom:0}
.ut-hit-w.nag{position:sticky;top:0;z-index:1;background:var(--pow2);border-bottom:1px solid var(--ramka);padding:10px 14px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--tekst3)}
.ut-hit-w > :nth-child(n+3){text-align:right;white-space:nowrap}
.ut-hit-w .nr{text-align:right;color:var(--tekst3);font-weight:700}
.ut-hit-w .nz{min-width:0}
.ut-hit-w .nz > span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.ut-hit-w .pas{display:flex;height:6px;margin-top:6px;border-radius:3px;background:var(--linia);overflow:hidden}
.ut-hit-w .pas i{display:block;height:100%}
.ut-hit-w .pas .f{background:var(--F)}
.ut-hit-w .pas .r{background:var(--R)}
.ut-hit-w > b{font-size:15px}
.ut-hit-w .u{color:var(--tekst2)}
.ut-hit-info{font-size:13px;color:var(--tekst3);margin:10px 2px 0}
.ut-hit-pon{text-align:center;margin-top:12px}
.ut-hit-kiedy{display:flex;justify-content:space-between;align-items:baseline;gap:6px 14px;flex-wrap:wrap;font-size:14px;color:var(--tekst2);margin:0}
.ut-hit-kiedy b{color:var(--tekst)}
.okno.ut-hit-o{width:min(760px,100%)}
.ut-hit-o .okno-g h2 .ikona{width:22px;height:22px}
.ut-chip{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 6px 0 11px;border-radius:999px;border:1px solid var(--mocRamka);background:var(--mocTlo);color:var(--mocTekst);font-size:13px;font-weight:800}
.ut-chip .ikona{width:15px;height:15px}

.tab-w{border:1px solid var(--ramka);background:var(--pow);border-radius:16px;overflow:auto;max-height:min(78vh,1000px);overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
table.tab{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
.tab th{position:sticky;top:0;z-index:2;background:var(--pow2);text-align:left;padding:10px;border-bottom:1px solid var(--ramka);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--tekst3);white-space:nowrap}
.tab th button{font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;display:inline-flex;align-items:center;gap:4px}
.tab td{padding:9px 10px;border-bottom:1px solid var(--linia);vertical-align:middle;white-space:nowrap}
.tab tbody tr{cursor:pointer}
.tab tbody tr:hover td,.tab tbody tr:focus-visible td{background:var(--pow3)}
.tab th.k,.tab td.k{text-align:right;font-variant-numeric:tabular-nums}
.tab td.g{font-variant-numeric:tabular-nums;font-weight:700}
.tab td.g small{display:block;font-weight:500;font-size:11.5px;color:var(--tekst3)}
.tab td.k b{font-size:14.5px}
.tab .nr{display:flex;align-items:center;gap:8px;min-width:0}
.tab .nr .mono{font-size:13px;color:var(--tekst2)}
.tab .zam{max-width:340px;overflow:hidden;text-overflow:ellipsis}
.tab .zam .wiecej{color:var(--tekst3);font-weight:700;margin-left:4px}
.tab .tagi{display:inline-flex;gap:5px;margin-left:8px;vertical-align:middle}
.tab tfoot td{position:sticky;bottom:0;z-index:2;background:var(--pow2);border-top:1px solid var(--ramka);border-bottom:0;font-weight:800}
.tab tr.poza td{color:var(--tekst3)}
.tab tr.poza td.k b{text-decoration:line-through;font-weight:600}
.tab tr.vou td{color:var(--tekst2)}
.tab tr.vou td.k b{font-weight:600}
.tab tr.nowy td{animation:ut-nowy 2.4s ease}
@keyframes ut-nowy{0%,40%{background:var(--okTlo)}100%{background:transparent}}
.mf{display:inline-flex;align-items:center;justify-content:center;width:24px;height:22px;border-radius:7px;border:1.5px solid var(--kol);color:var(--kol);font-weight:800;font-size:12.5px;flex:0 0 auto}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:6px;border:1px solid var(--ramka2);color:var(--tekst2);white-space:nowrap;line-height:1.2}
.tag.uw{border-color:var(--uwRamka);color:var(--uwTekst);background:var(--uwTlo)}
.tag.moc{border-color:var(--mocRamka);color:var(--mocTekst);background:var(--mocTlo)}
.tag.bl{border-color:var(--blRamka);color:var(--blTekst);background:var(--blTlo)}
.tag.ok{border-color:var(--okRamka);color:var(--okTekst);background:var(--okTlo)}
.tab-pusta{padding:28px 16px;text-align:center;color:var(--tekst2)}
.pokaz-tekst{font-size:12.5px;line-height:1.45;color:var(--tekst3);text-align:center;margin-top:18px}

/* ZDZISŁAW z dymkiem (pusty dzień, wczytywanie) */
.zdz-start{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;align-items:center;margin:26px auto 0;max-width:720px}
.zdz-start .zdz{width:150px}

/* okno transakcji */
.okno.ut-okno{width:min(680px,100%)}
.ut-okno .okno-g{align-items:center}
.ut-okno .okno-g h2{display:flex;align-items:center;gap:10px;min-width:0}
.ut-okno .okno-g h2 .mono{font-size:15px;color:var(--tekst2);font-weight:600}
.ut-ok-kw{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ut-ok-kw b{font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.ut-ok-kw span{font-size:14px;color:var(--tekst2);font-weight:700}
.ut-sek h3{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--tekst3);margin-bottom:8px}
.ut-poz{border:1px solid var(--ramka);border-radius:14px;overflow:hidden}
.ut-poz > div{display:grid;grid-template-columns:minmax(0,1fr) 54px 96px;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--linia);font-size:14px;font-variant-numeric:tabular-nums}
.ut-poz > div:last-child{border-bottom:0}
.ut-poz > div > span:nth-child(n+2){text-align:right;white-space:nowrap}
.ut-poz .dod{color:var(--tekst2)}
.ut-poz .raz{background:var(--pow2);font-weight:800}
.ut-szcz{display:grid;grid-template-columns:120px minmax(0,1fr);border:1px solid var(--ramka);border-radius:14px;overflow:hidden}
.ut-szcz > div{padding:9px 12px;border-bottom:1px solid var(--linia);font-size:14px;min-width:0;overflow-wrap:anywhere}
.ut-szcz > div:nth-last-child(-n+2){border-bottom:0}
.ut-szcz .et{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--tekst3);background:var(--pow2);display:flex;align-items:center}
.ut-przebieg{display:grid;gap:0;border-left:2px solid var(--ramka2);margin-left:6px;padding-left:14px}
.ut-przebieg > div{position:relative;display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;padding:5px 0;font-size:14px}
.ut-przebieg > div::before{content:"";position:absolute;left:-20px;top:11px;width:10px;height:10px;border-radius:50%;background:var(--pow);border:2px solid var(--ramka2)}
.ut-przebieg > div.wazne::before{border-color:var(--mUt);background:var(--mUt)}
.ut-przebieg > div.zm::before{border-color:var(--uwRamka);background:var(--uwTlo)}
.ut-przebieg b{font-variant-numeric:tabular-nums;font-weight:800}
.ut-uwaga{border:1px dashed var(--uwRamka);background:var(--uwTlo);color:var(--uwTekst);border-radius:14px;padding:11px 14px;font-size:14px}
.ut-zrodlo{font-size:12.5px;color:var(--tekst3)}

/* kalendarz dni (wybór dnia z archiwum) */
.okno.ut-kal-o{width:min(560px,100%)}
.ut-kal-n{display:grid;grid-template-columns:var(--wys) minmax(0,1fr) var(--wys);gap:10px;align-items:center}

    function awatar(o, kl) {
      var imie = String(o.imie || o.login);
      return '<span class="dw-awatar' + (kl ? ' ' + kl : '') + '"' + (o.kolor ? ' style="--kol:' + esc(o.kolor) + '"' : '') + '>' + esc(imie.charAt(0).toUpperCase()) + '</span>';
    }
    function htmlInna() {          // „+ Inna osoba · Інша особа” — druga część (po ukraińsku) mniejsza, w drugiej linii
      var cz = String(K.inna).split(' · ');
      return cz.length > 1 ? '<span>' + T(cz[0]) + '</span><span class="dw-kafel-inna-ua">' + T(cz.slice(1).join(' · ')) + '</span>' : T(K.inna);
    }
    function htmlKafelki() {
      var os = osoby();
      var k = os.map(function (o) {
        var imie = o.imie || o.login;
        return '<div class="dw-kafel-w"><button type="button" class="dw-kafel" data-dw="osoba" data-v="' + esc(o.login) + '" data-test="osoba-' + esc(o.login) + '"' + (S.edycja ? ' disabled' : '') + '>' +
          awatar(o) + '<span class="dw-kafel-imie">' + esc(imie) + '</span>' +
          '<span class="dw-kafel-rola">' + (o.podpis ? esc(o.podpis) : '<span class="dw-mono">' + esc(o.login) + '</span>') + (o.ua ? '<span class="dw-znacznik">UA</span>' : '') + '</span></button>' +
          (S.edycja ? '<button type="button" class="dw-kafel-x" data-dw="zapomnij" data-v="' + esc(o.login) + '" aria-label="Usuń ' + esc(imie) + ' z tego urządzenia">×</button>' : '') + '</div>';
      }).join('');
      return '<div class="dw-uklad"><div>' +
        (K.edycja && K.zapomnij
          ? '<div class="dw-rzad"><span class="dw-etykieta">' + T(K.kto) + '</span><button type="button" class="dw-link dw-link-maly" data-dw="edycja" data-test="edytuj-liste">' + (S.edycja ? 'Gotowe' : 'Edytuj listę') + '</button></div>'
          : '<div><span class="dw-etykieta">' + T(K.kto) + '</span></div>') +
        htmlWiad() + '<div class="dw-kafelki">' + k + (S.edycja ? '' : '<button type="button" class="dw-kafel dw-kafel-inna" data-dw="inna" data-test="inna-osoba">' + htmlInna() + '</button>') + '</div>' +
        (S.edycja ? '<p class="dw-uwaga">Usunięcie kafelka nie usuwa konta — osoba zaloguje się znowu przez „Inna osoba”.</p>' : '') +
        '</div>' + htmlZdz(K.zdzKafelki) + '</div>';
    }
    function htmlLogin() {
      return '<div class="dw-uklad"><form class="dw-form" data-dw-form="login" autocomplete="off" novalidate>' + htmlWiad() +
        '<div class="dw-pole"><label class="dw-etykieta" for="' + id('login') + '">' + T(K.etykietaLogin) + '</label>' +
        '<input id="' + id('login') + '" data-dw-pole="login" data-test="login" type="text" name="username" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="40" enterkeyhint="next" placeholder="' + esc(K.placeholder) + '" value="' + esc(S.login) + '">' +
        '<span class="dw-pomoc">' + TL(K.pomoc) + '</span>' +
        '<span class="dw-blad" role="alert" data-test="blad-loginu"' + (S.blad ? '' : ' hidden') + '>' + esc(S.blad) + '</span></div>' +
        '<button type="submit" class="dw-glowny" data-test="dalej">' + T(K.dalej) + '</button>' +
        (osoby().length ? '<button type="button" class="dw-link" data-dw="kafelki" data-test="do-kafelkow">' + ik('wstecz', 'dw-mala') + ' Wróć do kafelków</button>' : '') +
        '</form>' + htmlZdz(K.zdzLogin) + '</div>';
    }
    function htmlKropki() {
      var ile = Math.min(Math.max(dlZnana() || 6, S.pin.length), K.maxPin), h = '';
      for (var i = 0; i < ile; i++) h += '<span class="' + (i < S.pin.length ? 'dw-p' : '') + '"></span>';
      return h;
    }
    function komunikat() {
      if (S.wysyla) return { r: 'czeka', kl: '', t: S.otwiera ? 'Otwieram…' : 'Sprawdzam…' };
      if (S.czekaDo > Date.now() && S.blad) return { r: 'blad', kl: ' dw-pin-blad', t: S.blad, alert: true };   // serwer podał godzinę
      var lok = lokalnaMs();
      if (lok > 0) return { r: 'blad', kl: ' dw-pin-blad', t: 'Za dużo prób — spróbuj za ' + Math.max(1, Math.ceil(lok / 1000)) + ' s', alert: true };
      if (S.blad) return { r: 'blad', kl: ' dw-pin-blad', t: S.blad, alert: true };
      if (S.info) return { r: 'info', kl: S.infoRodzaj === 'uwaga' ? ' dw-pin-uwaga' : ' dw-pin-ok', t: S.info };
      var dl = dlZnana();
      return { r: 'zwykly', kl: '', t: dl ? 'PIN ma ' + dl + ' cyfr.' : K.podpowiedzPin };
    }
    function htmlPin() {
      var o = S.osoba, imie = o.imie || o.login, zab = zablokowanyMs() > 0, wyl = (S.wysyla || zab) ? ' disabled' : '';
      var klaw = ['1', '2', '3', '4', '5', '6', '7', '8', '9'].map(function (n) {
        return '<button type="button" class="dw-kl" data-dw="cyfra" data-v="' + n + '" data-test="pin-' + n + '"' + wyl + '>' + n + '</button>';
      }).join('') +
        '<button type="button" class="dw-kl dw-maly" data-dw="cofnij" data-test="pin-cofnij" aria-label="Usuń cyfrę"' + (S.wysyla ? ' disabled' : '') + '>⌫</button>' +
        '<button type="button" class="dw-kl" data-dw="cyfra" data-v="0" data-test="pin-0"' + wyl + '>0</button>' +
        '<button type="button" class="dw-kl dw-ok-kl" data-dw="pin-ok" data-test="pin-zaloguj" aria-label="Zaloguj"' + (S.pin.length >= 6 && !S.wysyla && !zab ? '' : ' disabled') + '>' + ik('ok') + '</button>';
      var km = komunikat(), notka = '';
      if (K.notkaPin) { try { notka = K.notkaPin(o) || ''; } catch (e) { notka = ''; } }
      return '<div class="dw-pin-uklad"><div class="dw-pin' + (S.wysyla ? ' dw-wysyla' : '') + '" data-dw-pin>' +
        awatar(o, 'dw-duzy') +
        '<div class="dw-pin-imie" data-test="pin-osoba">' + esc(imie) + '</div>' +
        '<div class="dw-pin-pod">' + (o.imie && String(o.imie).toLowerCase() !== String(o.login).toLowerCase() ? '<span class="dw-mono">' + esc(o.login) + '</span> · ' : '') + T(K.wpiszPin) + '</div>' +
        '<div class="dw-kropki" data-dw-kropki aria-live="polite" aria-label="Wpisano ' + S.pin.length + ' cyfr">' + htmlKropki() + '</div>' +
        '<div class="dw-pin-hint' + km.kl + '" data-dw-komunikat data-test="pin-komunikat" data-rodzaj="' + km.r + '"' + (km.alert ? ' role="alert"' : ' role="status"') + '>' + T(km.t) + '</div>' +
        '<div class="dw-klaw" data-dw-klaw>' + klaw + '</div>' +
        '<div class="dw-pin-linki"><button type="button" class="dw-link" data-dw="wroc" data-test="pin-wroc">' + ik('wstecz', 'dw-mala') + ' Inna osoba</button>' +
        (K.prosba ? '<button type="button" class="dw-link" data-dw="prosba" data-test="pin-prosba">Nie pamiętam PIN-u</button>' : '') + '</div>' +
        (notka ? '<div class="dw-pin-notka">' + T(notka) + '</div>' : '') +
        '</div><div class="dw-pin-zdz">' + zdz('tyl', 'ZDZISŁAW stoi tyłem — widać ważkę na głowie i baterię atomową') + '<p>' + T(K.zdzPin) + '</p></div></div>';
    }
    function html() {
      var tresc = S.krok === 'pin' && S.osoba ? htmlPin() : (S.krok === 'login' || !osoby().length ? htmlLogin() : htmlKafelki());
      return '<div class="dw-w">' +
        '<div class="dw-gora"><div><h1 class="dw-logo dw-bebas">' + esc(K.nazwa) + '</h1>' +
        '<span class="dw-pod' + (K.pokaz ? ' dw-pokaz' : '') + '">' + T(K.opis) + '</span></div>' + htmlMotyw() + '</div>' +
        tresc +
        (K.link && K.link.tekst ? '<a class="dw-dolny" href="' + esc(K.link.href || '#') + '" data-test="link-dolny">' + T(K.link.tekst) + '</a>' : '') +
        '</div>';
    }

    /* ───────────── rysowanie ───────────── */
    function rysuj() {
      if (!root) return;
      var a = document.activeElement, bylFokusLoginu = a && a.getAttribute && a.getAttribute('data-dw-pole') === 'login' && root.contains(a);
      root.className = 'dw ' + (motyw() === 'jasny' ? 'dw-jasny' : 'dw-ciemny');
      root.setAttribute('data-modul', K.modul);
      root.setAttribute('data-krok', S.krok === 'pin' && S.osoba ? 'pin' : (S.krok === 'login' || !osoby().length ? 'login' : 'kafelki'));
      root.innerHTML = html();
      if (root.getAttribute('data-krok') === 'login') {
        var i = root.querySelector('[data-dw-pole="login"]');
        if (i && (bylFokusLoginu || !S.blad)) setTimeout(function () { if (S.widoczny && i.isConnected && document.activeElement !== i) { try { i.focus({ preventScroll: true }); } catch (e) { i.focus(); } } }, 30);
      }
      zaplanujOdliczanie();
    }
    /* PIN: przy każdej cyfrze odświeżamy tylko kropki, komunikat i klawisze — ZDZISŁAW nie miga od nowa */
    function odswiezPin() {
      if (!root || root.getAttribute('data-krok') !== 'pin') { rysuj(); return; }
      var pin = root.querySelector('[data-dw-pin]'), kr = root.querySelector('[data-dw-kropki]'), km = root.querySelector('[data-dw-komunikat]');
      if (!pin || !kr || !km) { rysuj(); return; }
      pin.classList.toggle('dw-wysyla', !!S.wysyla);
      kr.innerHTML = htmlKropki(); kr.setAttribute('aria-label', 'Wpisano ' + S.pin.length + ' cyfr');
      var k = komunikat();
      km.className = 'dw-pin-hint' + k.kl; km.setAttribute('role', k.alert ? 'alert' : 'status'); km.setAttribute('data-rodzaj', k.r); km.innerHTML = T(k.t);
      var zab = zablokowanyMs() > 0;
      Array.prototype.forEach.call(root.querySelectorAll('[data-dw="cyfra"]'), function (b) { b.disabled = !!(S.wysyla || zab); });
      var c = root.querySelector('[data-dw="cofnij"]'); if (c) c.disabled = !!S.wysyla;
      var ok = root.querySelector('[data-dw="pin-ok"]'); if (ok) ok.disabled = !(S.pin.length >= 6 && !S.wysyla && !zab);
      zaplanujOdliczanie();
    }
    function zaplanujOdliczanie() {
      clearTimeout(odliczT);
      if (!S.widoczny || S.krok !== 'pin') return;
      if (lokalnaMs() > 0) { S.byloOdliczanie = true; odliczT = setTimeout(odswiezPin, 1000); }
      else if (S.byloOdliczanie) { S.byloOdliczanie = false; S.blad = ''; odliczT = setTimeout(odswiezPin, 0); }   // po minucie — czysto, bez starego błędu
    }
    function potrzasnij() {
      var p = root && root.querySelector('[data-dw-pin]');
      if (!p) return;
      p.classList.remove('dw-potrzasnij'); void p.offsetWidth; p.classList.add('dw-potrzasnij');
    }
    function zaplanujMrug() {
      clearTimeout(mrugT);
      if (!S.widoczny || !OBRAZY.powitanie_mrug) return;
      mrugT = setTimeout(function () {
        if (root) Array.prototype.forEach.call(root.querySelectorAll('[data-dw-poza="powitanie"] img'), function (z) {
          z.src = OBRAZY.powitanie_mrug;
          setTimeout(function () { if (z.isConnected) z.src = OBRAZY.powitanie; }, 150);
        });
        zaplanujMrug();
      }, 3200 + Math.random() * 3800);
    }

    /* ───────────── kroki ───────────── */
    function doPinu(o) {
      S.wiad = null;
      S.osoba = o; S.krok = 'pin'; S.pin = ''; S.blad = ''; S.info = ''; S.poBledzie = false; S.wysyla = false; S.otwiera = false;
      rysuj();
    }
    function doStartu() {
      S.osoba = null; S.pin = ''; S.blad = ''; S.info = ''; S.wysyla = false; S.otwiera = false; S.edycja = false;
      S.krok = osoby().length ? 'kafelki' : 'login';
      rysuj();
    }
    function dalejZLoginu() {
      var l = S.login.trim();
      if (!l) { S.blad = 'Wpisz login.'; rysuj(); return; }
      if (!/^[A-Za-z0-9][A-Za-z0-9._@+-]{1,39}$/.test(l)) { S.blad = 'Login to litery i cyfry (stare loginy także z kropką).'; rysuj(); return; }
      var z = osoby().filter(function (x) { return String(x.login).toLowerCase() === l.toLowerCase(); })[0];
      S.blad = '';
      doPinu(z || { login: l, imie: l, dl: 0 });
    }
    function cyfra(c) {
      if (S.krok !== 'pin' || S.wysyla || zablokowanyMs() > 0 || S.pin.length >= K.maxPin) return;
      S.pin += c; S.blad = ''; S.info = '';
      var dl = dlZnana();
      if (dl && S.pin.length === dl) { wyslij(); return; }
      odswiezPin();
    }
    function cofnij() { if (S.wysyla) return; S.pin = S.pin.slice(0, -1); odswiezPin(); }
    function wyslij() {
      if (S.wysyla || !S.osoba) return;
      if (zablokowanyMs() > 0) { odswiezPin(); return; }
      if (S.pin.length < 6) { S.blad = 'PIN ma co najmniej 6 cyfr.'; odswiezPin(); potrzasnij(); return; }
      if (!K.zaloguj) { S.blad = 'Logowanie nie jest podłączone.'; odswiezPin(); return; }
      var pin = S.pin, osoba = S.osoba;
      S.wysyla = true; S.blad = ''; S.info = ''; odswiezPin();
      Promise.resolve().then(function () { return K.zaloguj(osoba, pin); }).then(function () {
        S.pin = ''; S.otwiera = true;            // moduł zwykle już schował okno; jeśli nie — „Otwieram…”
        if (S.widoczny && S.krok === 'pin') odswiezPin();
      }, function (e) {
        S.wysyla = false; S.otwiera = false; S.pin = ''; S.poBledzie = true;
        S.blad = (e && e.message) || 'Nie udało się zalogować.';
        if (e && e.status === 429) {
          var dt = e.czeka_do ? new Date(e.czeka_do).getTime() - Date.now() : 60e3;
          if (!(dt > 0)) dt = 60e3;
          S.czekaDo = Date.now() + Math.min(Math.max(dt, 1000), 16 * 60e3);
          clearTimeout(czekaT);
          czekaT = setTimeout(function () { S.czekaDo = 0; if (S.widoczny && S.krok === 'pin') { S.blad = ''; odswiezPin(); } }, S.czekaDo - Date.now());
        }
        if (S.widoczny) { if (S.krok === 'pin') { odswiezPin(); potrzasnij(); } }
      });
    }
    function prosba() {
      if (!K.prosba || !S.osoba || S.wysyla) return;
      S.blad = ''; S.info = 'Wysyłam prośbę…'; S.infoRodzaj = 'ok'; odswiezPin();
      Promise.resolve().then(function () { return K.prosba(S.osoba.login); }).then(function () {
        S.info = 'Prośba wysłana. Kierownik zobaczy ją w managerze — nowy PIN dostaniesz osobiście.'; odswiezPin();
      }, function (e) {
        S.info = ''; S.blad = (e && e.message) || 'Nie udało się wysłać prośby — spróbuj za chwilę.'; odswiezPin();
      });
    }

    /* ───────────── zdarzenia ───────────── */
    var AKCJE = {
      motyw: function (el) {
        var m = el.getAttribute('data-v') === 'jasny' ? 'jasny' : 'ciemny';
        try { K.ustawMotyw(m); } catch (e) { /* moduł bez motywu */ }
        root.className = 'dw ' + (motyw() === 'jasny' ? 'dw-jasny' : 'dw-ciemny');
        Array.prototype.forEach.call(root.querySelectorAll('[data-dw="motyw"]'), function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-v') === motyw())); });
      },
      osoba: function (el) { var v = el.getAttribute('data-v'); var o = osoby().filter(function (x) { return x.login === v; })[0]; if (o) doPinu(o); },
      inna: function () { S.krok = 'login'; S.login = ''; S.blad = ''; S.wiad = null; rysuj(); },
      kafelki: function () { S.krok = 'kafelki'; S.blad = ''; rysuj(); },
      edycja: function () { S.edycja = !S.edycja; rysuj(); },
      zapomnij: function (el) {
        if (!K.zapomnij) return;
        try { K.zapomnij(el.getAttribute('data-v')); } catch (e) { /* zostaje na liście */ }
        if (!osoby().length) { S.edycja = false; S.krok = 'login'; }
        rysuj();
      },
      cyfra: function (el) { cyfra(el.getAttribute('data-v')); },
      cofnij: cofnij,
      'pin-ok': wyslij,
      wroc: doStartu,
      prosba: prosba
    };
    function naKlik(e) {
      var el = e.target && e.target.closest ? e.target.closest('[data-dw]') : null;
      if (!el || !root.contains(el) || el.disabled) return;
      var a = AKCJE[el.getAttribute('data-dw')];
      if (a) { e.preventDefault(); a(el); }
    }
    function naWyslanie(e) {
      if (e.target && e.target.getAttribute && e.target.getAttribute('data-dw-form') === 'login') { e.preventDefault(); dalejZLoginu(); }
    }
    function naWpis(e) {
      var t = e.target;
      if (!t || !t.getAttribute || t.getAttribute('data-dw-pole') !== 'login') return;
      var v = t.value.replace(/\s/g, '');
      if (v !== t.value) t.value = v;
      S.login = v;
      if (S.blad) { S.blad = ''; var b = root.querySelector('[data-test="blad-loginu"]'); if (b) { b.textContent = ''; b.hidden = true; } }
    }
    function naKlawisz(e) {
      if (!S.widoczny || S.krok !== 'pin' || !S.osoba || e.metaKey || e.ctrlKey || e.altKey) return;
      var t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
      if (/^\d$/.test(e.key)) { e.preventDefault(); cyfra(e.key); }
      else if (e.key === 'Backspace') { e.preventDefault(); cofnij(); }
      else if (e.key === 'Enter') { e.preventDefault(); wyslij(); }
      else if (e.key === 'Escape') { e.preventDefault(); doStartu(); }
    }

    function zbudujRoot() {
      if (root) return;
      wstawCss();
      root = document.createElement('div');
      root.className = 'dw dw-ciemny';
      root.id = 'dysza-wejscie' + (nr > 1 ? '-' + nr : '');
      if (K.zIndex != null) root.style.zIndex = String(K.zIndex);   // np. pod okienkami i dymkami modułu
      root.hidden = true;
      root.addEventListener('click', naKlik);
      root.addEventListener('submit', naWyslanie);
      root.addEventListener('input', naWpis);
      document.body.appendChild(root);
    }

    var API = {
      wersja: WERSJA,
      /* opcje: { krok: 'kafelki'|'login'|'pin', osoba: {login, imie, dl, …}, komunikat: 'tekst', rodzaj: 'blad'|'uwaga'|'info'|'ok' }
         — komunikat na PIN-ie: pomarańczowy (uwaga) albo zielony (ok); na kafelkach i przy loginie: czerwony (blad), pomarańczowy, szary (info) */
      pokaz: function (opcje) {
        opcje = opcje || {};
        zbudujRoot();
        var czekaDo = S.czekaDo;                   // blokada z serwera trwa także po powrocie do okna
        S = nowyStan(); S.czekaDo = czekaDo;
        if (opcje.krok === 'pin' && opcje.osoba && opcje.osoba.login) { S.krok = 'pin'; S.osoba = opcje.osoba; }
        else if (opcje.krok === 'login' || !osoby().length) S.krok = 'login';
        else S.krok = 'kafelki';
        if (opcje.komunikat) {
          if (S.krok === 'pin') { S.info = String(opcje.komunikat); S.infoRodzaj = opcje.rodzaj === 'ok' ? 'ok' : 'uwaga'; }
          else S.wiad = { t: String(opcje.komunikat), r: opcje.rodzaj || 'blad' };      // rodzaj: 'blad' | 'uwaga' | 'info'
        }
        if (opcje.login) S.login = String(opcje.login);
        S.widoczny = true;
        root.hidden = false;
        document.addEventListener('keydown', naKlawisz);
        rysuj();
        zaplanujMrug();
        try { root.scrollTop = 0; } catch (e) { /* stare przeglądarki */ }
        return API;
      },
      ukryj: function () {
        S.widoczny = false;
        clearTimeout(mrugT); clearTimeout(odliczT);
        document.removeEventListener('keydown', naKlawisz);
        if (root) { root.hidden = true; root.innerHTML = ''; }
        return API;
      },
      odswiez: function () { if (S.widoczny) { if (S.krok === 'pin') odswiezPin(); else rysuj(); } return API; },
      widoczne: function () { return !!S.widoczny; },
      ustaw: function (zmiany) { for (var z in (zmiany || {})) K[z] = zmiany[z]; if (S.widoczny) rysuj(); return API; },
      zniszcz: function () {
        API.ukryj();
        if (root) {
          root.removeEventListener('click', naKlik); root.removeEventListener('submit', naWyslanie); root.removeEventListener('input', naWpis);
          if (root.parentNode) root.parentNode.removeChild(root);
          root = null;
        }
      },
      _stan: function () { return S; }
    };
    return API;
  }

  window.DyszaWejscie = { wersja: WERSJA, utworz: utworz };
})();

</script>
<script>
